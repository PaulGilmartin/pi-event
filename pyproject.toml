[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-event"
version = "0.1.0"
description = "Capture Raspberry Pi camera events and send them to an HTTP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Paul Gilmartin" },
]
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
pi-event = "pi_event.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["pi_event"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
